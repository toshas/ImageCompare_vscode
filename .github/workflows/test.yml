name: Tests

# Cross-platform test matrix. Runs ALL three layers — unit, webview, integration —
# on Windows/Linux/macOS, so nothing has to be run by hand. Every assertion is
# deterministic and OS-agnostic (no pixel snapshots, no local baselines). Native
# risks (Sharp per-platform binary, FS watcher) are proven on each real OS.
on:
  push:
    branches: [main, 'test/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

# Cancel superseded runs on the same ref to avoid burning minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo's own gate battery (nine ts-node suites, mutation check, invariant+comment checkers)
  # runs on every push/PR too, so no event sees less than the full union of both test systems.
  gates:
    name: gates (ts-node suites + mutation + checkers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node scripts/check-invariants.mjs
      - run: node scripts/comment-lint.mjs
      - run: npm test
      - run: node scripts/mutation-check.mjs

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds dist/extension.js + dist/webview.js (needed by integration tests
      # which activate the real extension) and installs the host-OS Sharp binary.
      - run: npm run compile

      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Layer 3 — drives the real webview bundle in headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Webview tests (Playwright)
        run: npm run test:webview

      # Integration tests launch a real headless VSCode. Linux needs a virtual
      # display; macOS/Windows run it directly.
      - name: Integration tests (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      # macOS ARM runners: the download can report success while the Electron binary is not
      # spawnable (ENOENT). Harness robustness, not a hack: pre-download, then verify/repair the
      # app bundle (quarantine xattr, exec bit) and fail HERE with diagnostics if the binary is
      # absent — so the actual test step only ever runs against a spawnable VS Code.
      - name: Pre-download and repair VS Code (macOS)
        if: runner.os == 'macOS'
        run: |
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode()"
          xattr -dr com.apple.quarantine .vscode-test || true
          BIN=$(find .vscode-test -type f -path "*Contents/MacOS/Electron" | head -1)
          if [ -z "$BIN" ]; then echo "Electron binary missing after download:"; find .vscode-test -maxdepth 4 | head -50; exit 1; fi
          chmod +x "$BIN"
          echo "Electron OK: $BIN"

      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
