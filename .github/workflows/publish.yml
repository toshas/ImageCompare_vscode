name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_ovsx:
        description: 'Publish to Open VSX'
        type: boolean
        default: true
      publish_vsce:
        description: 'Publish to VS Code Marketplace'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      # An uncited invariant is decoration; a dangling citation is a lie. See CLAUDE.md.
      - name: Check invariant citations
        run: node scripts/check-invariants.mjs

      # A run of consecutive // lines is a comment block; it belongs in docs/. See CLAUDE.md.
      - name: Check comment length
        run: node scripts/comment-lint.mjs

      # One list of suites, in package.json — a second copy here would silently go stale.
      - name: Run tests
        run: npm test

      - name: Mutation check
        run: node scripts/mutation-check.mjs

  # The full 3-OS three-layer matrix must also be green before any release build (workflow_call into test.yml).
  test-full:
    uses: ./.github/workflows/test.yml

  build:
    needs: [test, test-full]
    strategy:
      matrix:
        include:
          # Native x64 builds
          - os: ubuntu-latest
            target: linux-x64
            npm_os: linux
            npm_cpu: x64
          - os: macos-15
            target: darwin-x64
            npm_os: darwin
            npm_cpu: x64
          - os: windows-latest
            target: win32-x64
            npm_os: win32
            npm_cpu: x64
          # ARM64 builds (cross-compile on x64 runners)
          - os: ubuntu-latest
            target: linux-arm64
            npm_os: linux
            npm_cpu: arm64
          - os: macos-latest
            target: darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - os: windows-latest
            target: win32-arm64
            npm_os: win32
            npm_cpu: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # The wasm32 pack/untar/@emnapi steps below are one of the two hand-maintained lists building the VSIX's node_modules (docs/image-backends.md: vsix-modules-hand-assembled).
      - name: Install platform-specific Sharp
        run: |
          SHARP_VERSION=$(node -p "require('./package.json').dependencies.sharp")
          rm -rf node_modules/sharp node_modules/@img
          # Install native binaries for target platform
          npm install --os=${{ matrix.npm_os }} --cpu=${{ matrix.npm_cpu }} --force "sharp@$SHARP_VERSION"
          # Install WASM fallback for older CPUs (must use npm pack since --cpu flag doesn't work)
          npm pack "@img/sharp-wasm32@$SHARP_VERSION"
          mkdir -p node_modules/@img/sharp-wasm32
          tar -xzf img-sharp-wasm32-*.tgz -C node_modules/@img/sharp-wasm32 --strip-components=1
          rm img-sharp-wasm32-*.tgz
          # Install WASM package dependencies
          npm install @emnapi/runtime@^1.7.0
        shell: bash

      - name: Package extension
        run: npx vsce package --target ${{ matrix.target }}

      # Losing the hand-extracted WASM tier is a silent perf cliff; see docs/image-backends.md.
      - name: Verify WASM fallback is in the VSIX
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const vsix = fs.readdirSync(".").find(f => f.endsWith(".vsix"));
            if (!vsix) { console.error("::error::no .vsix produced"); process.exit(1); }
            const bytes = fs.readFileSync(vsix);
            // Zip entry names are stored uncompressed, so a substring scan needs no unzip dep.
            const required = [
              "node_modules/@img/sharp-wasm32/lib/sharp-wasm32.node.wasm",
              "node_modules/@emnapi/runtime/",
            ];
            const missing = required.filter(p => !bytes.includes(p));
            if (missing.length) {
              console.error("::error::" + vsix + " is missing the WASM fallback: " + missing.join(", ") +
                " — check the order of the Sharp install steps; see docs/image-backends.md");
              process.exit(1);
            }
            console.log("OK: " + vsix + " contains the WASM fallback");
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'

  # The artifact must install into the Open VSX-family host (VSCodium = what Cursor et al. build on)
  # BEFORE anything is published — a packaging defect here is exactly what dev-mode tests can't see.
  codium-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix-linux-x64
      - name: Install the VSIX into VSCodium and verify it registers
        run: |
          TAG=$(curl -s https://api.github.com/repos/VSCodium/vscodium/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          curl -sL -o codium.tar.gz "https://github.com/VSCodium/vscodium/releases/download/$TAG/VSCodium-linux-x64-$TAG.tar.gz"
          mkdir codium && tar xzf codium.tar.gz -C codium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libnss3 libgbm1 libasound2t64 || sudo apt-get install -y -qq xvfb libnss3 libgbm1 libasound2
          VSIX=$(ls *.vsix | head -1)
          xvfb-run -a ./codium/bin/codium --install-extension "$VSIX" --user-data-dir .ud --extensions-dir .ext
          xvfb-run -a ./codium/bin/codium --list-extensions --show-versions --user-data-dir .ud --extensions-dir .ext | tee installed.txt
          grep -q "obukhovai.image-compare" installed.txt

  publish:
    needs: [build, codium-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: vsix-files
          merge-multiple: true

      - name: List VSIX files
        run: ls -la vsix-files/

      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || inputs.publish_ovsx }}
        run: |
          npm install -g ovsx
          for vsix in vsix-files/*.vsix; do
            echo "Publishing $vsix to Open VSX..."
            ovsx publish "$vsix" --pat ${{ secrets.OVSX_TOKEN }}
          done

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' || inputs.publish_vsce }}
        run: |
          npm install -g @vscode/vsce
          for vsix in vsix-files/*.vsix; do
            echo "Publishing $vsix to VS Code Marketplace..."
            vsce publish --packagePath "$vsix" --pat ${{ secrets.VSCE_TOKEN }}
          done

  # After publishing: prove Open VSX actually serves the new version and that the served VSIX
  # still carries the WASM tier (the registry copy is what Cursor/VSCodium users install).
  verify-openvsx:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll Open VSX for the released version and scan the served VSIX
        run: |
          VER=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            LIVE=$(curl -s https://open-vsx.org/api/obukhovai/image-compare | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" || true)
            [ "$LIVE" = "$VER" ] && break
            sleep 30
          done
          [ "$LIVE" = "$VER" ] || { echo "Open VSX never served $VER (last: $LIVE)"; exit 1; }
          curl -sL -o served.vsix "https://open-vsx.org/api/obukhovai/image-compare/linux-x64/$VER/file/obukhovai.image-compare-$VER@linux-x64.vsix"
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile('served.vsix').namelist()
          req = ["extension/node_modules/@img/sharp-wasm32/lib/sharp-wasm32.node.wasm", "extension/node_modules/@emnapi/runtime/"]
          missing = [r for r in req if not any(n.startswith(r) or n == r for n in names)]
          assert not missing, f"served VSIX missing: {missing}"
          print("Open VSX serves a complete VSIX")
          PY
